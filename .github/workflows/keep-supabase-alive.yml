name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  # Memungkinkan kita untuk menjalankan script secara manual jika diperlukan
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Portofolio untuk menjaga Supabase tetap aktif
        run: |
          echo "Mengirim request ke API Portofolio Gana..."
          curl -sS "https://portofolio-gana.vercel.app/api/projects" > /dev/null
          echo "Berhasil! Database Supabase telah tersentuh dan akan tetap aktif."
